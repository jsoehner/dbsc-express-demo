version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  commit-message:
    prefix: ci
    include: scope
  labels:
  - dependencies
  - security-governance
  assignees:
  - jsoehner
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  commit-message:
    prefix: chore(deps)
  labels:
  - dependencies
  - python
  - security-governance
  assignees:
  - jsoehner
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  commit-message:
    prefix: chore(deps)
  labels:
  - dependencies
  - javascript
  - security-governance
  assignees:
  - jsoehner
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: eclipse-temurin
    update-types:
    - version-update:semver-major
  labels:
  - dependencies
  - docker
  - security-governance
  assignees:
  - jsoehner
