name: Software & Cryptographic Bill of Materials (SBOM & CBOM)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  call-sbom-workflow:
    uses: jsoehner/sbom-cbom-workflow@main
    with:
      output_dir: "oss"
      scripts_dir: "scripts"
      docs_path: "docs/security"
      requirements_path: "requirements.txt"
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}