name: JSI Build & Functional Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    uses: jsoehner/jsi-build-verify/.github/workflows/jsi-build-verify.yml@accaaa7b714267e48b08ec2d75aec2b3da24bb90 # v1.0.0
    with:
      workflow_ref: accaaa7b714267e48b08ec2d75aec2b3da24bb90
      commit_mode: report-only
      fail_on_error: true
      comment_on_pr: true
    secrets: inherit
